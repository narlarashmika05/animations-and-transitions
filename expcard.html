<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Card</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            background-color: lightblue;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            width: 250px;
            height: 250px;
            background-color: lightcoral;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Card Title</h2>
        <p>This is a simple card. Click to expand.</p>
    </div>
</body>

</html>
