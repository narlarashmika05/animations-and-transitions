<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <style>
        .sidebar {
            display: flex;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
           display:flex;
            flex-direction: column; 
            gap: 10px;
            background-color: aqua;
            width: 200px;
            height: 100vh;
            padding: 20px;
        }
        nav a{
            text-decoration: none;
            color: black;
            font-size: 18px;
        }
        @media(max-width:768px){
            nav{
                display: none;
            }
            .sidebar{
                display: block;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Student Management Dashboard</h1>
    </div>
    <div class="sidebar">
        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Students</a>
            <a href="#">Courses</a>
            <a href="#">Settings</a>
        </nav>
        <div class="content">
            <h2>Welcome to Student Management Dashboard</h2>
            <p>This is the main content area</p>
        </div>
    </div>
</body>

</html>
