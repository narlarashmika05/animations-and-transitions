<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signal Automation</title>
    <style>
        .traffic {
            width: 100px;
            height: 300px;
            background-color: black;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .red {
            background-color: red;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            animation: redLight 2s infinite;

        }

        .yellow {
            background-color: yellow;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            animation: yellowLight 2s infinite;
        }

        .green {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            animation: greenLight 2s infinite;
        }

        @keyframes redLight {

            0%,
            33% {
                background: red;
            }

            34%,
            100% {
                background: gray;
            }
        }

        @keyframes yellowLight {

            0%,
            33% {
                background: gray;
            }

            34%,
            66% {
                background: yellow;
            }

            67%,
            100% {
                background: gray;
            }
        }

        @keyframes greenLight {

            0%,
            66% {
                background: gray;
            }

            67%,
            100% {
                background: limegreen;
            }
        }
    </style>
</head>

<body>
    <div class="traffic">
        <div class="red"></div>
        <div class="yellow"></div>
        <div class="green"></div>

    </div>
</body>

</html>
